<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | University Management System</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top right, #1e3a8a 0%, #0f172a 100%);
      position: relative;
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      z-index: 10;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-surface);
      border-radius: var(--radius-xl);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .login-card-header {
      padding: 2.5rem 2.25rem 1.5rem;
      text-align: center;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
    }

    .login-ums-title {
      font-size: var(--font-size-xs);
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.35rem;
    }

    .login-heading {
      font-size: var(--font-size-xl);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .login-subtext {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-bottom: 0;
    }

    .login-card-body {
      padding: 2rem 2.25rem 2.25rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-with-icon {
      padding-left: 2.75rem !important;
    }

    .password-toggle {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      color: var(--text-main);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      font-size: var(--font-size-xs);
    }

    .forgot-link {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-demo-notice {
      background-color: var(--bg-surface-alt);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      margin-top: 1.5rem;
      font-size: var(--font-size-xs);
      color: var(--text-secondary);
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .login-footer-nav {
      text-align: center;
      margin-top: 1.75rem;
    }

    .home-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #cbd5e1;
      font-size: var(--font-size-sm);
      font-weight: 500;
      transition: color var(--transition-fast);
      text-decoration: none;
    }

    .home-back-link:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <!-- LOGO & BRAND HEADER -->
      <div class="login-card-header">
        <img src="images/logo/logo.svg" alt="Apex Global University UMS Logo" class="login-logo">
        <div class="login-ums-title">University Management System</div>
        <h1 class="login-heading">Admin Portal Login</h1>
        <p class="login-subtext">Enter your administrative credentials to access the console</p>
      </div>

      <!-- FORM -->
      <div class="login-card-body">
        <form action="dashboard.html" method="get" id="adminLoginForm">
          
          <!-- Email / Username Field -->
          <div class="form-group">
            <label for="username" class="form-label">Email or Administrative ID</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="username" 
                name="username" 
                class="form-control input-with-icon" 
                placeholder="admin@apex.edu or ADM-2026-01" 
                value="admin@apex.edu" 
                required
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-control input-with-icon" 
                placeholder="Enter your password" 
                value="adminPass2026!" 
                required
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle" id="togglePasswordBtn" aria-label="Toggle password visibility">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-options">
            <label class="form-check" for="rememberMe">
              <input type="checkbox" id="rememberMe" name="remember" class="form-check-input" checked>
              <span>Remember this workstation</span>
            </label>
            <a href="#" class="forgot-link" onclick="alert('Please contact Campus IT Services (it-support@apex.edu or Ext. 4401) for password reset assistance.'); return false;">
              Forgot Password?
            </a>
          </div>

          <!-- Submit Button (Directs to dashboard.html) -->
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Sign In to Dashboard
          </button>

          <!-- Static Demo Note -->
          <div class="login-demo-notice">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--info)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <div>
              <strong>Static Demo Mode:</strong> Default admin credentials are pre-filled. Click <em>Sign In to Dashboard</em> to view the live Admin Dashboard.
            </div>
          </div>

        </form>

        <!-- Home / Back link -->
        <div class="login-footer-nav">
          <a href="index.html" class="home-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Public Homepage
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Pure frontend toggle password visibility script
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('password');

    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
      });
    }

    // Direct submit handler ensures clean static navigation to dashboard
    const loginForm = document.getElementById('adminLoginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        window.location.href = 'dashboard.html';
      });
    }
  </script>

</body>
</html>
