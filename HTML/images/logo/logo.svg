<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring Accent -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 2" />

  <!-- Shield Base -->
  <path d="M 60 12 
           C 85 12, 102 18, 102 36
           C 102 68, 86 94, 60 108
           C 34 94, 18 68, 18 36
           C 18 18, 35 12, 60 12 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="2.5"
        filter="url(#dropShadow)" />

  <!-- Inner Shield Border -->
  <path d="M 60 18 
           C 80 18, 95 23, 95 38
           C 95 64, 82 87, 60 100
           C 38 87, 25 64, 25 38
           C 25 23, 40 18, 60 18 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.2" 
        opacity="0.8" />

  <!-- Academic Mortarboard (Cap) -->
  <g transform="translate(60, 38)">
    <!-- Cap Diamond -->
    <polygon points="0,-12 24,-3 0,6 -24,-3" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Cap Skull Cap Underneath -->
    <path d="M -12 0 C -12 8, 12 8, 12 0" fill="#d97706" />
    <!-- Tassel -->
    <path d="M 0,-3 C 8, -2, 16, 2, 17, 8 L 18, 14" fill="none" stroke="#fef3c7" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="18" cy="14" r="1.5" fill="#fef3c7" />
  </g>

  <!-- Open Book of Knowledge -->
  <g transform="translate(60, 64)">
    <!-- Left Page -->
    <path d="M -2 -8 C -12 -12, -22 -10, -22 10 C -12 8, -2 9, -2 12 Z" fill="#ffffff" />
    <!-- Right Page -->
    <path d="M 2 -8 C 12 -12, 22 -10, 22 10 C 12 8, 2 9, 2 12 Z" fill="#ffffff" />
    <!-- Book Spine -->
    <path d="M -2 12 C 0 11, 0 11, 2 12 L 2 -8 C 0 -9, 0 -9, -2 -8 Z" fill="#cbd5e1" />
    <!-- Text Lines on Left Page -->
    <line x1="-18" y1="-3" x2="-6" y2="-3" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="-18" y1="1" x2="-6" y2="1" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="-18" y1="5" x2="-8" y2="5" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <!-- Text Lines on Right Page -->
    <line x1="6" y1="-3" x2="18" y2="-3" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="1" x2="18" y2="1" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="5" x2="16" y2="5" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Laurel Leaves / Academic Stars at Bottom -->
  <g fill="url(#goldGrad)">
    <polygon points="60,86 61.5,90 65.5,90 62.5,92.5 63.5,96.5 60,94 56.5,96.5 57.5,92.5 54.5,90 58.5,90" />
    <circle cx="50" cy="90" r="1.5" />
    <circle cx="70" cy="90" r="1.5" />
  </g>
</svg>
